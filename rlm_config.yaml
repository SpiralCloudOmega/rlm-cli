# RLM Configuration
# See: arXiv:2512.24601

# Maximum iterations per query before giving up
max_iterations: 20

# Maximum recursive sub-agent depth (paper uses 1 — sub-calls are flat LLMs, not nested RLMs)
max_depth: 1

# Maximum total sub-queries across all iterations
max_sub_queries: 50

# Truncate REPL output beyond this many characters
truncate_len: 5000

# Preview lines shown in context metadata
metadata_preview_lines: 20

# Optional frontier sub-model for chunk analysis.
# Leave commented out to use the root model for all calls.
# Examples:
#   sub_model: kimi-k3
#   sub_model: claude-fable-5
# sub_model: kimi-k3

# Production resource controls (0 means unlimited where noted)
max_total_tokens: 0
max_cost_usd: 0
max_concurrency: 8
min_request_interval_ms: 0
max_retries: 2

# Target sub-query chunk size. 0 derives a safe size from the sub-model context window.
chunk_size_chars: 0
